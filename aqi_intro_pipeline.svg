<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AQI story pipeline</title>
  <desc id="desc">A visual showing pollution sources, AQI measurement, analysis, and prediction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0f5f73"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dff3f7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="110" fill="#ffd166" fill-opacity="0.18"/>
  <circle cx="160" cy="80" r="80" fill="#7bdff2" fill-opacity="0.12"/>
  <text x="70" y="92" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">AQI analysis from source to insight</text>
  <text x="70" y="128" fill="#d8f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">Real-world air quality varies by traffic, weather, industry, and local geography.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="180" width="180" height="220" rx="24" fill="url(#card)"/>
    <text x="160" y="228" text-anchor="middle" fill="#17324f" font-size="22" font-weight="700">Sources</text>
    <text x="160" y="270" text-anchor="middle" fill="#17324f" font-size="18">Traffic</text>
    <text x="160" y="304" text-anchor="middle" fill="#17324f" font-size="18">Industry</text>
    <text x="160" y="338" text-anchor="middle" fill="#17324f" font-size="18">Weather</text>
    <text x="160" y="372" text-anchor="middle" fill="#17324f" font-size="18">Seasonality</text>

    <polygon points="280,290 340,260 340,280 430,280 430,300 340,300 340,320" fill="#ffd166"/>

    <rect x="450" y="180" width="250" height="220" rx="24" fill="url(#card)"/>
    <text x="575" y="228" text-anchor="middle" fill="#17324f" font-size="22" font-weight="700">Measured AQI</text>
    <text x="575" y="272" text-anchor="middle" fill="#17324f" font-size="18">Good</text>
    <text x="575" y="306" text-anchor="middle" fill="#17324f" font-size="18">Moderate</text>
    <text x="575" y="340" text-anchor="middle" fill="#17324f" font-size="18">Unhealthy</text>
    <text x="575" y="374" text-anchor="middle" fill="#17324f" font-size="18">Hazardous</text>

    <polygon points="730,290 790,260 790,280 880,280 880,300 790,300 790,320" fill="#ffd166"/>

    <rect x="900" y="180" width="230" height="220" rx="24" fill="url(#card)"/>
    <text x="1015" y="228" text-anchor="middle" fill="#17324f" font-size="22" font-weight="700">Insight</text>
    <text x="1015" y="272" text-anchor="middle" fill="#17324f" font-size="18">Classify risk</text>
    <text x="1015" y="306" text-anchor="middle" fill="#17324f" font-size="18">Compare models</text>
    <text x="1015" y="340" text-anchor="middle" fill="#17324f" font-size="18">Explain splits</text>
    <text x="1015" y="374" text-anchor="middle" fill="#17324f" font-size="18">Support decisions</text>
  </g>
</svg>
