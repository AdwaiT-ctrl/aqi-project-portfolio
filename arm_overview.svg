<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">ARM metrics overview</title>
  <desc id="d">Support, confidence, and lift comparison cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#023047"/>
      <stop offset="100%" stop-color="#219ebc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Association Rule Metrics</text>
  <text x="60" y="104" fill="#dff6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">Each rule is evaluated with support, confidence, and lift.</text>

  <rect x="70" y="150" width="320" height="250" rx="20" fill="#ffffff"/>
  <text x="230" y="205" text-anchor="middle" fill="#17324f" font-size="28" font-weight="700">Support</text>
  <text x="230" y="245" text-anchor="middle" fill="#17324f" font-size="18">How often A and B</text>
  <text x="230" y="273" text-anchor="middle" fill="#17324f" font-size="18">appear together</text>
  <text x="230" y="320" text-anchor="middle" fill="#005f73" font-size="22" font-weight="700">P(A ∩ B)</text>

  <rect x="440" y="150" width="320" height="250" rx="20" fill="#ffffff"/>
  <text x="600" y="205" text-anchor="middle" fill="#17324f" font-size="28" font-weight="700">Confidence</text>
  <text x="600" y="245" text-anchor="middle" fill="#17324f" font-size="18">How often B appears</text>
  <text x="600" y="273" text-anchor="middle" fill="#17324f" font-size="18">when A appears</text>
  <text x="600" y="320" text-anchor="middle" fill="#005f73" font-size="22" font-weight="700">P(B | A)</text>

  <rect x="810" y="150" width="320" height="250" rx="20" fill="#ffffff"/>
  <text x="970" y="205" text-anchor="middle" fill="#17324f" font-size="28" font-weight="700">Lift</text>
  <text x="970" y="245" text-anchor="middle" fill="#17324f" font-size="18">Rule strength beyond</text>
  <text x="970" y="273" text-anchor="middle" fill="#17324f" font-size="18">random co-occurrence</text>
  <text x="970" y="320" text-anchor="middle" fill="#005f73" font-size="22" font-weight="700">Confidence / P(B)</text>
</svg>
