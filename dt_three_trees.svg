<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Three decision tree variants</title>
  <desc id="desc">Three small decision tree sketches with different root nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="100%" stop-color="#0b7285"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf6f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <text x="60" y="76" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Three tree variants</text>
  <text x="60" y="110" fill="#dceef2" font-family="Segoe UI, Arial, sans-serif" font-size="18">Changing the root feature changes the structure, path lengths, and explanation style.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="150" width="330" height="300" rx="26" fill="url(#panel)"/>
    <text x="225" y="194" text-anchor="middle" fill="#17324f" font-size="24" font-weight="700">Tree 1</text>
    <text x="225" y="222" text-anchor="middle" fill="#17324f" font-size="18">Root: PM2.5</text>
    <rect x="135" y="258" width="180" height="52" rx="16" fill="#d8f3dc"/>
    <text x="225" y="291" text-anchor="middle" fill="#17324f" font-size="16" font-weight="700">Split: high / low particles</text>
    <line x1="225" y1="310" x2="160" y2="360" stroke="#17324f" stroke-width="4"/>
    <line x1="225" y1="310" x2="290" y2="360" stroke="#17324f" stroke-width="4"/>
    <rect x="95" y="360" width="130" height="48" rx="14" fill="#caffbf"/>
    <text x="160" y="390" text-anchor="middle" fill="#17324f" font-size="15" font-weight="700">Leaf: Safe</text>
    <rect x="225" y="360" width="130" height="48" rx="14" fill="#ffadad"/>
    <text x="290" y="390" text-anchor="middle" fill="#17324f" font-size="15" font-weight="700">Leaf: Risky</text>

    <rect x="435" y="150" width="330" height="300" rx="26" fill="url(#panel)"/>
    <text x="600" y="194" text-anchor="middle" fill="#17324f" font-size="24" font-weight="700">Tree 2</text>
    <text x="600" y="222" text-anchor="middle" fill="#17324f" font-size="18">Root: NO2</text>
    <rect x="510" y="258" width="180" height="52" rx="16" fill="#ffd6a5"/>
    <text x="600" y="291" text-anchor="middle" fill="#17324f" font-size="16" font-weight="700">Split: traffic influence</text>
    <line x1="600" y1="310" x2="535" y2="360" stroke="#17324f" stroke-width="4"/>
    <line x1="600" y1="310" x2="665" y2="360" stroke="#17324f" stroke-width="4"/>
    <rect x="470" y="360" width="130" height="48" rx="14" fill="#caffbf"/>
    <text x="535" y="390" text-anchor="middle" fill="#17324f" font-size="15" font-weight="700">Leaf: Lower class</text>
    <rect x="600" y="360" width="130" height="48" rx="14" fill="#ff758f"/>
    <text x="665" y="390" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Leaf: Higher class</text>

    <rect x="810" y="150" width="330" height="300" rx="26" fill="url(#panel)"/>
    <text x="975" y="194" text-anchor="middle" fill="#17324f" font-size="24" font-weight="700">Tree 3</text>
    <text x="975" y="222" text-anchor="middle" fill="#17324f" font-size="18">Root: CO</text>
    <rect x="885" y="258" width="180" height="52" rx="16" fill="#caf0f8"/>
    <text x="975" y="291" text-anchor="middle" fill="#17324f" font-size="16" font-weight="700">Split: combustion signal</text>
    <line x1="975" y1="310" x2="910" y2="360" stroke="#17324f" stroke-width="4"/>
    <line x1="975" y1="310" x2="1040" y2="360" stroke="#17324f" stroke-width="4"/>
    <rect x="845" y="360" width="130" height="48" rx="14" fill="#ffd6a5"/>
    <text x="910" y="390" text-anchor="middle" fill="#17324f" font-size="15" font-weight="700">Leaf: Moderate</text>
    <rect x="975" y="360" width="130" height="48" rx="14" fill="#ffadad"/>
    <text x="1040" y="390" text-anchor="middle" fill="#17324f" font-size="15" font-weight="700">Leaf: Hazardous</text>
  </g>
</svg>
