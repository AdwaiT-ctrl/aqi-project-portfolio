<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Naive Bayes overview</title>
  <desc id="desc">A comparison of Gaussian, Multinomial, Bernoulli, and Categorical Naive Bayes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <text x="60" y="76" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Naive Bayes family</text>
  <text x="60" y="110" fill="#dbe9ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">All variants use Bayes' rule, but each assumes a different feature shape.</text>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#17324f">
    <rect x="60" y="160" width="250" height="270" rx="24" fill="url(#card)"/>
    <text x="185" y="210" text-anchor="middle" font-size="26" font-weight="700">Gaussian NB</text>
    <text x="185" y="250" text-anchor="middle" font-size="17">Continuous values</text>
    <text x="185" y="282" text-anchor="middle" font-size="17">Assumes normal curves</text>
    <text x="185" y="314" text-anchor="middle" font-size="17">Best for measurements</text>
    <path d="M120 365 C145 300, 165 290, 185 270 C205 290, 225 300, 250 365" fill="none" stroke="#1d7a8c" stroke-width="4"/>

    <rect x="340" y="160" width="250" height="270" rx="24" fill="url(#card)"/>
    <text x="465" y="210" text-anchor="middle" font-size="26" font-weight="700">Multinomial NB</text>
    <text x="465" y="250" text-anchor="middle" font-size="17">Counts or nonnegative features</text>
    <text x="465" y="282" text-anchor="middle" font-size="17">Common in text or frequency data</text>
    <rect x="395" y="340" width="20" height="48" fill="#ffb703"/>
    <rect x="430" y="322" width="20" height="66" fill="#fb8500"/>
    <rect x="465" y="300" width="20" height="88" fill="#ffb703"/>
    <rect x="500" y="336" width="20" height="52" fill="#fb8500"/>

    <rect x="620" y="160" width="250" height="270" rx="24" fill="url(#card)"/>
    <text x="745" y="210" text-anchor="middle" font-size="26" font-weight="700">Bernoulli NB</text>
    <text x="745" y="250" text-anchor="middle" font-size="17">Binary features</text>
    <text x="745" y="282" text-anchor="middle" font-size="17">0 or 1 presence/absence</text>
    <circle cx="710" cy="352" r="18" fill="#90be6d"/>
    <circle cx="745" cy="352" r="18" fill="#90be6d"/>
    <circle cx="780" cy="352" r="18" fill="#adb5bd"/>
    <circle cx="815" cy="352" r="18" fill="#90be6d"/>

    <rect x="900" y="160" width="240" height="270" rx="24" fill="url(#card)"/>
    <text x="1020" y="210" text-anchor="middle" font-size="26" font-weight="700">Categorical NB</text>
    <text x="1020" y="250" text-anchor="middle" font-size="17">Discrete categories</text>
    <text x="1020" y="282" text-anchor="middle" font-size="17">Works after binning</text>
    <rect x="950" y="336" width="44" height="44" rx="8" fill="#8ecae6"/>
    <rect x="1000" y="316" width="44" height="64" rx="8" fill="#219ebc"/>
    <rect x="1050" y="346" width="44" height="34" rx="8" fill="#8ecae6"/>
  </g>
</svg>
